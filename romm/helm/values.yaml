nameOverride: ""
fullnameOverride: ""

romm:
  image:
    repository: rommapp/romm
    tag: "3.10.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Host paths on the k8s node — matched to /mnt/store/romm layout
  hostPaths:
    library: /mnt/store/romm/GAMES   # contains roms/ and bios/
    assets:  /mnt/store/romm/assets
    config:  /mnt/store/romm/config

  persistence:
    resources:
      size: 5Gi
    redisData:
      size: 1Gi

  env:
    hasheousApiEnabled: "true"
    screenscraper:
      user: ""
      password: ""
    retroachievements:
      apiKey: ""
    steamgriddb:
      apiKey: ""
    igdb:
      clientId: ""
      clientSecret: ""


mariadb:
  image:
    repository: mariadb
    tag: "11.4.3"
    pullPolicy: IfNotPresent

  database: romm
  user: romm-user

  persistence:
    size: 10Gi

# Sensitive credentials — set at install time via --set or a values override file.
# Generate rommAuthSecretKey with: openssl rand -hex 32

ingress:
  enabled: true
  className: nginx
  host: romm.home.arpa
secrets:
  dbPassword: ""
  dbRootPassword: ""
  rommAuthSecretKey: ""
