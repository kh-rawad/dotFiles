apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "romm.fullname" . }}
  labels:
    {{- include "romm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "romm.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "romm.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "romm.dbServiceName" . }} 3306; do echo "waiting for mariadb..."; sleep 3; done
      containers:
        - name: romm
          image: "{{ .Values.romm.image.repository }}:{{ .Values.romm.image.tag }}"
          imagePullPolicy: {{ .Values.romm.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ include "romm.dbServiceName" . | quote }}
            - name: DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: DB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: HASHEOUS_API_ENABLED
              value: {{ .Values.romm.env.hasheousApiEnabled | quote }}
            - name: SCREENSCRAPER_USER
              value: {{ .Values.romm.env.screenscraper.user | quote }}
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "romm.fullname" . }}-secret
                  key: DB_PASSWD
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "romm.fullname" . }}-secret
                  key: ROMM_AUTH_SECRET_KEY
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "romm.fullname" . }}-secret
                  key: SCREENSCRAPER_PASSWORD
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "romm.fullname" . }}-secret
                  key: RETROACHIEVEMENTS_API_KEY
            - name: STEAMGRIDDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "romm.fullname" . }}-secret
                  key: STEAMGRIDDB_API_KEY
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "romm.fullname" . }}-secret
                  key: IGDB_CLIENT_ID
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "romm.fullname" . }}-secret
                  key: IGDB_CLIENT_SECRET
          volumeMounts:
            - name: resources
              mountPath: /romm/resources
            - name: redis-data
              mountPath: /redis-data
            - name: library
              mountPath: /romm/library
            - name: assets
              mountPath: /romm/assets
            - name: config
              mountPath: /romm/config
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: {{ include "romm.fullname" . }}-resources
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "romm.fullname" . }}-redis-data
        - name: library
          hostPath:
            path: {{ .Values.romm.hostPaths.library }}
            type: Directory
        - name: assets
          hostPath:
            path: {{ .Values.romm.hostPaths.assets }}
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: {{ .Values.romm.hostPaths.config }}
            type: DirectoryOrCreate
