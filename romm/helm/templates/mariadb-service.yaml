apiVersion: v1
kind: Service
metadata:
  # Named "romm-db" to match DB_HOST env var used by the romm container
  name: romm-db
  labels:
    {{- include "romm.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "romm.fullname" . }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
