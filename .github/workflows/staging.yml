name: MegaLinter

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APPLY_FIXES: all
  APPLY_FIXES_EVENT: pull_request
  APPLY_FIXES_MODE: commit

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  megalinter:
    name: CI / MegaLinter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Show Git state
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "PR source branch: ${{ github.event.pull_request.head.ref }}"
          echo "PR target branch: ${{ github.event.pull_request.base.ref }}"
          echo "Checked out branch:"
          git branch --show-current
          echo "HEAD:"
          git log -1 --oneline
          echo "Remote:"
          git remote -v

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Show Git state after MegaLinter
        if: always()
        run: |
          echo "Git status:"
          git status --short --branch

          echo "Current branch:"
          git branch --show-current

          echo "HEAD:"
          git log -3 --oneline --decorate

          echo "Remotes:"
          git remote -v

      - name: Archive MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          if-no-files-found: ignore
